<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 · 页面走丢了 | Braisedfish</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#080a10">
    <link rel="icon" href="/favicon.ico">
    <style>
        :root {
            color-scheme: dark;
            --text: #eef1f7;
            --muted: #909cb1;
            --card: rgba(255, 255, 255, .06);
            --border: rgba(255, 255, 255, .1);
            --accent: #9b8cff;
            --accent-2: #ff7ab0;
            --accent-3: #6ee2ff;
        }

        [data-theme="light"] {
            color-scheme: light;
            --text: #12151c;
            --muted: #5f6878;
            --card: rgba(255, 255, 255, .62);
            --border: rgba(255, 255, 255, .9);
            --accent: #5b3df5;
            --accent-2: #e0346e;
            --accent-3: #0aa2c0;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            background-color: #0b0e14;
            color: var(--text);
            font-family: "Inter", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            overflow: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            z-index: -2;
            background: url("https://pic1.imgdb.cn/item/6887884858cb8da5c8e9b512.jpg") center / cover no-repeat;
            transform: scale(1.03);
        }

        body::after {
            z-index: -1;
            background: linear-gradient(180deg, rgba(6, 8, 14, .6), rgba(6, 8, 14, .9));
        }

        [data-theme="light"] body::after {
            background: linear-gradient(180deg, rgba(247, 249, 253, .76), rgba(238, 242, 249, .92));
        }

        .card {
            width: 100%;
            max-width: 520px;
            padding: 48px 40px;
            border: 1px solid var(--border);
            border-radius: 22px;
            background: var(--card);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            text-align: center;
            box-shadow: 0 30px 70px rgba(0, 0, 0, .28);
        }

        .code {
            margin: 0;
            font-size: clamp(5rem, 22vw, 8rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -.05em;
            background-image: linear-gradient(100deg, var(--accent), var(--accent-2) 50%, var(--accent-3));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            margin: 18px 0 0;
            font-size: 22px;
            font-weight: 700;
        }

        p {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 28px;
            padding: 11px 22px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--card);
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: transform .25s cubic-bezier(.22, .61, .36, 1), border-color .25s ease;
        }

        .back:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        @media (prefers-reduced-motion: reduce) {
            .back { transition: none; }
        }
    </style>
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                if (saved !== 'light' && saved !== 'dark') {
                    saved = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
                }
                document.documentElement.dataset.theme = saved;
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <main class="card">
        <p class="code">404</p>
        <h1>哎呀，看来你拐错弯了</h1>
        <p>这个页面不存在，或者已经被搬到别处去了。</p>
        <a class="back" href="/">← 回到首页</a>
    </main>
</body>

</html>
